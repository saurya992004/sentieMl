services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelml}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      POSTGRES_MLFLOW_DB: ${POSTGRES_MLFLOW_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  object-store:
    image: chrislusf/seaweedfs:4.05
    restart: unless-stopped
    command: server -ip.bind=0.0.0.0 -s3 -s3.port=8333 -dir=/data -filer -filer.port=8888
    volumes:
      - object_store_data:/data
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 15

  object-store-init:
    # AWS CLI creates the MLflow bucket through the S3-compatible endpoint.
    image: amazon/aws-cli:2.40.3
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "aws --endpoint-url http://object-store:8333 s3api create-bucket --bucket $$MLFLOW_BUCKET || true"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sentinelml}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}

  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-sentinelml}:${POSTGRES_PASSWORD:-change-this-postgres-password}@postgres:5432/${POSTGRES_MLFLOW_DB:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}
      --serve-artifacts
      --allowed-hosts "*"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelml}
      POSTGRES_MLFLOW_DB: ${POSTGRES_MLFLOW_DB:-mlflow}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://object-store:8333
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sentinelml}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelml}:${POSTGRES_PASSWORD:-change-this-postgres-password}@postgres:5432/${POSTGRES_DB:-sentinelml}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://object-store:8333
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sentinelml}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - uploads_data:/data/uploads
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=training
    depends_on:
      api:
        condition: service_healthy
    environment: *app_env
    volumes:
      - uploads_data:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ["5173:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  object_store_data:
  uploads_data:
